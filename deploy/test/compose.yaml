name: odoo20-test
services:
  db:
    image: ${PG_IMAGE:?Set immutable PostgreSQL 16 image}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, odoo_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-odoo.sh:ro
    networks: [database]
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d odoo20"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  app:
    image: odoo20-test:0cdbc41e6e15
    build:
      context: .
      args:
        ODOO_COMMIT: 0cdbc41e6e1588ba5755df944ba2407bd4ed888f
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:18069:8069"]
    networks: [database, outbound]
    volumes: ["filestore:/var/lib/odoo"]
    secrets: [odoo_db_password, odoo_master_password, odoo_admin_password]
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=256m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  database: {internal: true}
  outbound: {}
volumes:
  pgdata: {}
  filestore: {}
secrets:
  postgres_password: {file: ./secrets/postgres_password}
  odoo_db_password: {file: ./secrets/odoo_db_password}
  odoo_master_password: {file: ./secrets/odoo_master_password}
  odoo_admin_password: {file: ./secrets/odoo_admin_password}
