# Included in the EXISTING nginx http {} context. No existing routes are replaced.
map $http_upgrade $odoo20_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=odoo20_login:10m rate=30r/m;
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    listen 443 ssl http2;
    server_name odoo.test.ai-data-platform.com;
    ssl_certificate /opt/odoo20-test/https/letsencrypt/live/odoo.test.ai-data-platform.com/fullchain.pem;
    ssl_certificate_key /opt/odoo20-test/https/letsencrypt/live/odoo.test.ai-data-platform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:Odoo20TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 64m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /var/log/nginx/odoo20.access.log;
    error_log /var/log/nginx/odoo20.error.log warn;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $odoo20_connection_upgrade;
    proxy_cookie_flags session_id secure httponly samesite=lax;
    proxy_connect_timeout 10s;
    proxy_read_timeout 720s;
    proxy_send_timeout 720s;
    location /web/database/ { return 403; }
    location = /web/login {
        limit_req zone=odoo20_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18069;
    }
    location ~ ^/websocket(?:/|$) {
        proxy_pass http://127.0.0.1:18072;
        proxy_buffering off;
    }
    location / { proxy_pass http://127.0.0.1:18069; }
}
